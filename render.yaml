databases:
  - name: cyberguard-db
    databaseName: cyberguard
    plan: free
    ipAllowList: []

services:
  # ── Backend API + Frontend ────────────────────────────────
  - type: web
    name: cyberguard
    env: python
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && pip install -r requirements-render.txt
    startCommand: cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --preload --log-level info
    envVars:
      - key: USE_TRANSFORMER
        value: "false"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        value: admin123456  # CHANGE THIS
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: cyberguard-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11"
